services:
  frontend:
    build:
      context: ./my-angular-app
      dockerfile: Dockerfile
    ports:
      - "4200:80"
    depends_on:
      - webapi

  webapi:
    build:
      context: ./DemoProjects
      dockerfile: WebApiDemo/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__TestDb=Server=sqlserver;Database=TestDb;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrong!Passw0rd
      - TZ=Asia/Taipei
    volumes:
      - ./DemoProjects/sqlserver/init.sql:/docker-entrypoint-initdb/init.sql
      - ./DemoProjects/sqlserver/entrypoint.sh:/docker-entrypoint-initdb/entrypoint.sh
    entrypoint: /bin/bash /docker-entrypoint-initdb/entrypoint.sh
